# Wobble, Stellr's research agent: once a day it picks TESS stars, investigates their light
# curves with Exoplanet Lab's pipeline (scripts/wobble.ts) and keeps what it found in Upstash
# Redis, read by the password-protected /wobble page. This repository is public, so nothing it
# finds is committed or printed here; the log shows counts only. Also runs on demand.
#
# Needs repository secrets UPSTASH_REDIS_REST_URL and UPSTASH_REDIS_REST_TOKEN (the same
# values as the site's KV_REST_API_URL / KV_REST_API_TOKEN in Vercel).
name: Wobble

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

concurrency:
  group: wobble
  cancel-in-progress: false

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes tsx@4.19.2 scripts/wobble.ts
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
